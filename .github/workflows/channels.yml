name: Channel-list-generator

on:
  # Trigger manuale
  workflow_dispatch:
  # Trigger schedulato (ogni 6 ore)
  schedule:
    - cron: '0 3 * * 1'

jobs:
  run-channel-list-generator:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run It channel list script
        run: python it_channel_list.py
        
      # Commit e Push dei file generati
      - name: Commit generated EPG 
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated EPG Update"
          file_pattern: 'master_channels.json'
          branch: main 
