name: epg-dtv-generator

on:
  # Trigger manuale
  workflow_dispatch:
  # Trigger schedulato (ogni 12 ore)
  schedule:
    - cron: '0 */12 * * *'

jobs:
  run-epg-generator:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run It epg script
        run: python epg_dtv_it.py
        
      # Commit e Push dei file generati
      - name: Commit generated EPG 
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated epg Update"
          file_pattern: 'epg_tv_it.xml'
          branch: main 
